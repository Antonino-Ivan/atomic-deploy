# Configurazione di esempio. Il file viene letto riga per riga, non eseguito:
# nessun comando qui dentro verrà lanciato, e una chiave sconosciuta è un errore.

# Radice dell'installazione. Sotto questa cartella vivono releases/, shared/,
# hooks/ e il collegamento current.
APP_ROOT=/srv/app

# Quante release conservare dopo ogni deploy. La release attiva e quella
# precedente non vengono mai rimosse, qualunque sia questo valore.
KEEP_RELEASES=5

# Cartelle che devono sopravvivere ai deploy: vivono in shared/ e ogni release
# le raggiunge tramite un collegamento. Elenco separato da spazi.
SHARED_DIRS=storage/logs storage/uploads var/cache

# Come sopra, per i singoli file. È il posto giusto per la configurazione di
# ambiente, che non sta nel pacchetto e non cambia a ogni rilascio.
SHARED_FILES=.env

# Comando eseguito dopo l'attivazione, con la cartella corrente dentro current.
# Se fallisce per HEALTH_RETRIES volte, il collegamento torna alla release
# precedente da solo. Lasciare vuoto per non eseguire nessun controllo.
HEALTH_CHECK=curl -fsS --max-time 5 http://127.0.0.1:8080/health

HEALTH_RETRIES=5
HEALTH_DELAY=2

# Cartella degli hook, relativa ad APP_ROOT se non inizia con /.
HOOKS_DIR=hooks

# Proprietario e permessi applicati alla release appena creata. Lasciare vuoti
# per non toccarli: servono privilegi che uno script di deploy spesso non ha.
OWNER=app:app
PERMISSIONS=
